apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: foodx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: foodx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://mongo.foodx.svc.cluster.local:27017/foodx
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: foodx
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP